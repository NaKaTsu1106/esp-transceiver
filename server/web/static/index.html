<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP Transceiver Monitor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; font-size: 14px; display: flex; flex-direction: column; height: 100vh; }

  header { background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; flex-wrap: wrap; }
  header h1 { font-size: 16px; font-weight: 600; color: #58a6ff; flex-shrink: 0; }
  #conn-status { font-size: 12px; display: flex; align-items: center; gap: 6px; }
  #conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; transition: background 0.3s; }
  #conn-dot.disconnected { background: #f85149; }
  #conn-dot.connecting { background: #d29922; }
  #server-form { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  #server-input { background: #0d1117; border: 1px solid #30363d; color: #e6edf3; border-radius: 4px; padding: 4px 10px; font-size: 12px; width: 240px; font-family: monospace; }
  #server-input:focus { outline: none; border-color: #58a6ff; }
  #server-connect-btn { background: #1f6feb; border: none; color: #fff; border-radius: 4px; padding: 4px 12px; font-size: 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  #server-connect-btn:hover { background: #388bfd; }

  main { display: flex; flex-direction: column; flex: 1; overflow: hidden; padding: 16px; gap: 16px; }

  section { background: #161b22; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }

  .section-header { padding: 10px 16px; background: #21262d; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .section-header h2 { font-size: 13px; font-weight: 600; }
  .badge { background: #388bfd26; color: #58a6ff; border: 1px solid #388bfd66; border-radius: 12px; padding: 1px 8px; font-size: 11px; }

  /* 端末テーブル */
  #devices { flex-shrink: 0; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { padding: 8px 12px; text-align: left; color: #8b949e; font-weight: 500; border-bottom: 1px solid #30363d; white-space: nowrap; }
  tbody tr { border-bottom: 1px solid #21262d; transition: background 0.1s; }
  tbody tr:hover { background: #21262d; }
  tbody td { padding: 8px 12px; font-family: monospace; white-space: nowrap; }
  #no-devices { text-align: center; color: #484f58; padding: 20px; font-style: italic; }

  .status-badge { border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 500; }
  .status-standby      { background: #1a7f3726; color: #3fb950; border: 1px solid #1a7f3766; }
  .status-transmitting { background: #388bfd26; color: #58a6ff; border: 1px solid #388bfd66; }
  .status-receiving    { background: #9e6a0326; color: #d29922; border: 1px solid #9e6a0366; }
  .status-disconnected { background: #b62324;   color: #f85149; border: 1px solid #f8514966; }

  /* 音声モニター */
  #audio-monitor { flex-shrink: 0; }
  .audio-controls { display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
  .monitor-btn { border: none; border-radius: 4px; padding: 4px 14px; font-size: 12px; cursor: pointer; font-weight: 600; transition: all 0.15s; }
  .monitor-btn.start  { background: #238636; color: #fff; }
  .monitor-btn.start:hover { background: #2ea043; }
  .monitor-btn.stop   { background: #b62324; color: #fff; }
  .monitor-btn.stop:hover  { background: #f85149; }

  .monitor-btn:disabled { opacity: 0.4; cursor: default; }
  .monitor-btn.loopback     { background: #1b4332; color: #3fb950; border: 1px solid #238636; }
  .monitor-btn.loopback:hover { background: #238636; color: #fff; }
  .monitor-btn.loopback.on  { background: #d29922; color: #fff; border-color: #d29922; }
  .group-sel { background: #21262d; border: 1px solid #30363d; color: #e6edf3; border-radius: 4px; padding: 3px 8px; font-size: 12px; }
  #audio-status { font-size: 12px; color: #8b949e; }
  #audio-status.active { color: #3fb950; }
  .vu-wrap { display: flex; align-items: center; gap: 6px; }
  #vu-bar { width: 120px; height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; border: 1px solid #30363d; }
  #vu-fill { height: 100%; width: 0%; background: #3fb950; border-radius: 4px; transition: width 0.05s; }

  /* ログパネル */
  #logs { flex: 1; min-height: 0; }
  .log-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filter-btn { background: transparent; border: 1px solid #30363d; color: #8b949e; border-radius: 4px; padding: 2px 10px; font-size: 11px; cursor: pointer; transition: all 0.15s; }
  .filter-btn.active { border-color: #58a6ff; color: #58a6ff; background: #388bfd1a; }
  .filter-btn.warn.active  { border-color: #d29922; color: #d29922; background: #9e6a031a; }
  .filter-btn.error.active { border-color: #f85149; color: #f85149; background: #b623241a; }
  .clear-btn { margin-left: auto; background: transparent; border: 1px solid #30363d; color: #8b949e; border-radius: 4px; padding: 2px 10px; font-size: 11px; cursor: pointer; }
  .clear-btn:hover { color: #e6edf3; border-color: #8b949e; }

  #log-output { flex: 1; overflow-y: auto; padding: 8px 0; font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; }
  .log-line { padding: 2px 16px; line-height: 1.6; display: flex; gap: 8px; }
  .log-line:hover { background: #21262d; }
  .log-line.hidden { display: none; }
  .log-time  { color: #484f58; flex-shrink: 0; }
  .log-level { flex-shrink: 0; width: 36px; font-weight: 600; }
  .log-line.INFO  .log-level { color: #3fb950; }
  .log-line.WARN  .log-level { color: #d29922; }
  .log-line.ERROR .log-level { color: #f85149; }
  .log-device { color: #58a6ff; flex-shrink: 0; min-width: 110px; }
  .log-msg { color: #e6edf3; word-break: break-all; }
</style>
</head>
<body>

<header>
  <h1>IP Transceiver Monitor</h1>
  <div id="conn-status">
    <div id="conn-dot" class="disconnected"></div>
    <span id="conn-label">未接続</span>
  </div>
  <div id="server-form">
    <input id="server-input" type="text" placeholder="例: 192.168.1.1:8080 または example.com"
           autocomplete="off" spellcheck="false"
           onkeydown="if(event.key==='Enter') connectToServer()">
    <button id="server-connect-btn" onclick="connectToServer()">接続</button>
  </div>
</header>

<main>
  <!-- 接続端末一覧 -->
  <section id="devices">
    <div class="section-header">
      <h2>接続端末</h2>
      <span class="badge" id="device-count">0 台</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Session</th>
            <th>Device ID</th>
            <th>Group</th>
            <th>Status</th>
            <th>接続時刻</th>
            <th>最終応答</th>
          </tr>
        </thead>
        <tbody id="device-tbody">
          <tr id="no-devices"><td colspan="6">端末未接続</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- 音声モニター -->
  <section id="audio-monitor">
    <div class="section-header">
      <h2>音声モニター</h2>
      <span class="badge" id="audio-badge">停止中</span>
    </div>
    <div class="audio-controls">
      <label style="font-size:12px;color:#8b949e;">グループ</label>
      <select class="group-sel" id="audio-group">
        <option value="0">0 (全体)</option>
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
      <button class="monitor-btn start"    id="btn-start"    onclick="startMonitor()">モニター開始</button>
      <button class="monitor-btn stop"     id="btn-stop"     onclick="stopMonitor()" disabled>停止</button>
      <button class="monitor-btn loopback" id="btn-loopback" onclick="toggleLoopback()">ループバック OFF</button>

      <span id="audio-status">--</span>
      <div class="vu-wrap">
        <span style="font-size:11px;color:#484f58;">レベル</span>
        <div id="vu-bar"><div id="vu-fill"></div></div>
      </div>
    </div>
  </section>

  <!-- ログパネル -->
  <section id="logs">
    <div class="section-header">
      <h2>ログ</h2>
      <div class="log-toolbar">
        <button class="filter-btn active"       data-level="INFO"  onclick="toggleFilter('INFO',  this)">INFO</button>
        <button class="filter-btn warn  active" data-level="WARN"  onclick="toggleFilter('WARN',  this)">WARN</button>
        <button class="filter-btn error active" data-level="ERROR" onclick="toggleFilter('ERROR', this)">ERROR</button>
        <button class="clear-btn" onclick="clearLogs()">クリア</button>
      </div>
    </div>
    <div id="log-output"></div>
  </section>
</main>

<script>
const visibleLevels = new Set(['INFO', 'WARN', 'ERROR']);
let autoScroll = true;

// ---- WebSocket 接続 ----
let ws = null;
let audioSubscribed = false;
let currentServerHost = '';
let reconnectTimer = null;

function connectToServer() {
  const input = document.getElementById('server-input').value.trim();
  if (!input) return;

  // 前の接続・再接続タイマーをリセット
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (ws) { ws.onclose = null; ws.close(); ws = null; }

  currentServerHost = input;
  localStorage.setItem('wsHost', input);
  connect(input);
}

function buildWsUrl(host) {
  // プロトコルプレフィックスが含まれている場合はそのまま使用
  if (host.startsWith('ws://') || host.startsWith('wss://')) {
    return host.endsWith('/ws') ? host : host.replace(/\/$/, '') + '/ws';
  }
  // ページが HTTPS なら wss://, HTTP なら ws://
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  return `${scheme}://${host}/ws`;
}

function connect(host) {
  const dot   = document.getElementById('conn-dot');
  const label = document.getElementById('conn-label');
  dot.className = 'connecting';
  label.textContent = '接続中...';

  const wsUrl = buildWsUrl(host);
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    dot.className = '';
    label.textContent = `接続済み (${host})`;
    // 再接続時に音声サブスクライブを復元
    if (audioSubscribed) {
      ws.send(JSON.stringify({ action: 'subscribe_audio' }));
    }
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'devices' || msg.type === 'snapshot') renderDevices(msg.devices);
      else if (msg.type === 'log')            appendLog(msg);
      else if (msg.type === 'audio_init')     return;
      else if (msg.type === 'audio')          handleAudioFrame(msg);
      else if (msg.type === 'loopback_state') applyLoopbackState(msg.enabled);
    } catch (_) {}
  };

  ws.onclose = () => {
    dot.className = 'disconnected';
    label.textContent = '切断 (3秒後に再接続)';
    ws = null;
    reconnectTimer = setTimeout(() => connect(currentServerHost), 3000);
  };

  ws.onerror = () => {
    ws.close();
  };
}

// ページロード時: localStorage に保存済みのホストがあれば自動接続
window.addEventListener('load', () => {
  const saved = localStorage.getItem('wsHost');
  if (saved) {
    document.getElementById('server-input').value = saved;
    currentServerHost = saved;
    connect(saved);
  }
});

// ---- 端末テーブル ----
function renderDevices(devices) {
  const tbody = document.getElementById('device-tbody');
  const countEl = document.getElementById('device-count');
  tbody.innerHTML = '';

  if (!devices || devices.length === 0) {
    tbody.innerHTML = '<tr id="no-devices"><td colspan="6">端末未接続</td></tr>';
    countEl.textContent = '0 台';
    return;
  }

  countEl.textContent = devices.length + ' 台';
  devices.forEach(d => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${d.session_id}</td>
      <td>${d.device_id}</td>
      <td>${d.group_id}</td>
      <td><span class="status-badge status-${d.status}">${d.status}</span></td>
      <td>${d.connected_at}</td>
      <td>${d.last_seen}</td>
    `;
    tbody.appendChild(tr);
  });
}

// ---- ログ ----
function appendLog(entry) {
  const out = document.getElementById('log-output');
  const atBottom = out.scrollHeight - out.scrollTop <= out.clientHeight + 4;

  const line = document.createElement('div');
  line.className = `log-line ${entry.level}`;
  if (!visibleLevels.has(entry.level)) line.classList.add('hidden');

  line.innerHTML = `
    <span class="log-time">${entry.time}</span>
    <span class="log-level">${entry.level}</span>
    <span class="log-device">${entry.device_id || '-'}</span>
    <span class="log-msg">${escapeHtml(entry.message)}</span>
  `;
  out.appendChild(line);

  // 古いエントリを削除（最大500行）
  while (out.children.length > 500) out.removeChild(out.firstChild);

  if (atBottom) out.scrollTop = out.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleFilter(level, btn) {
  if (visibleLevels.has(level)) {
    visibleLevels.delete(level);
    btn.classList.remove('active');
  } else {
    visibleLevels.add(level);
    btn.classList.add('active');
  }
  document.querySelectorAll(`#log-output .log-line.${level}`).forEach(el => {
    el.classList.toggle('hidden', !visibleLevels.has(level));
  });
}

function clearLogs() {
  document.getElementById('log-output').innerHTML = '';
}

// 自動接続は window.load イベントで処理

// =====================================================================
// 音声モニター
// =====================================================================
let audioCtx = null;
let audioDecoder = null;
let nextPlayTime = 0;
let audioGroup = 1;
let frameCount = 0;

// Chrome の WebCodecs Opus デコーダは sampleRate に 8000 を指定しても
// 内部処理が 48000 Hz で行われ、出力サンプル数が 960（48kHz×20ms）になる。
// これを 8kHz として createBuffer すると音程が 6 倍低くなり間隔も広がる。
// 解決策: デコーダを 48000 Hz に設定し、audioData.sampleRate で動的に
// バッファレートと再生タイミングを決定する。
const OPUS_DECODE_RATE = 48000;

function startMonitor() {
  audioGroup = parseInt(document.getElementById('audio-group').value);

  // AudioContext はハードウェアのデフォルトレートで生成する。
  // 8000 Hz を強制すると Chrome が無視して内部レートと乖離するため指定しない。
  if (!audioCtx) {
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  nextPlayTime = audioCtx.currentTime + 0.1;

  // WebCodecs AudioDecoder
  if (!window.AudioDecoder) {
    setAudioStatus('WebCodecs 非対応ブラウザです (Chrome 94+ 必要)', false);
    return;
  }
  if (audioDecoder) { audioDecoder.close(); audioDecoder = null; }

  audioDecoder = new AudioDecoder({
    output: (audioData) => {
      const n    = audioData.numberOfFrames;
      // audioData.sampleRate が実際の出力レート（48000 など）を保持する
      const rate = audioData.sampleRate || OPUS_DECODE_RATE;
      const pcm  = new Float32Array(n);
      audioData.copyTo(pcm, { planeIndex: 0, format: 'f32-planar' });
      audioData.close();

      // バッファは実際の出力レートで作成する（8000 固定にしない）
      const buf = audioCtx.createBuffer(1, n, rate);
      buf.copyToChannel(pcm, 0);

      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      if (nextPlayTime < now) nextPlayTime = now + 0.05;
      src.start(nextPlayTime);
      // 再生スケジュールもデコーダの実際のレートで計算する
      nextPlayTime += n / rate;

      // VUメーター
      let peak = 0;
      for (let i = 0; i < pcm.length; i++) { const v = Math.abs(pcm[i]); if (v > peak) peak = v; }
      document.getElementById('vu-fill').style.width = Math.min(peak * 200, 100) + '%';
    },
    error: (e) => setAudioStatus('デコードエラー: ' + e.message, false)
  });

  // 48000 Hz を明示することで Chrome が内部処理レートと一致した出力を返す
  audioDecoder.configure({ codec: 'opus', sampleRate: OPUS_DECODE_RATE, numberOfChannels: 1 });

  // WebSocket 経由で音声サブスクライブ
  audioSubscribed = true;
  frameCount = 0;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ action: 'subscribe_audio' }));
  }

  setAudioStatus('受信中... (Group ' + audioGroup + ')', true);
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  document.getElementById('audio-badge').textContent = '受信中';
  document.getElementById('audio-badge').style.color = '#3fb950';
}

function handleAudioFrame(msg) {
  // グループフィルター（0=全体）
  if (audioGroup !== 0 && msg.group !== audioGroup) return;
  if (!audioDecoder || audioDecoder.state === 'closed') return;

  try {
    const raw  = atob(msg.data);
    const opus = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) opus[i] = raw.charCodeAt(i);

    frameCount++;
    setAudioStatus('受信中... (Group ' + audioGroup + ') ' + frameCount + ' frames', true);

    audioDecoder.decode(new EncodedAudioChunk({
      type:      'key',
      timestamp: msg.ts * 1000, // ms → μs
      data:      opus,
    }));
  } catch (_) {}
}

function stopMonitor() {
  audioSubscribed = false;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ action: 'unsubscribe_audio' }));
  }
  if (audioDecoder && audioDecoder.state !== 'closed') { audioDecoder.close(); audioDecoder = null; }
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('audio-badge').textContent = '停止中';
  document.getElementById('audio-badge').style.color = '';
  document.getElementById('vu-fill').style.width = '0%';
  setAudioStatus('--', false);
}

function setAudioStatus(msg, active) {
  const el = document.getElementById('audio-status');
  el.textContent = msg;
  el.className = active ? 'active' : '';
}

// ---- ループバックトグル ----
let loopbackEnabled = false;

function applyLoopbackState(enabled) {
  loopbackEnabled = enabled;
  const btn = document.getElementById('btn-loopback');
  if (enabled) {
    btn.textContent = 'ループバック ON';
    btn.classList.add('on');
  } else {
    btn.textContent = 'ループバック OFF';
    btn.classList.remove('on');
  }
}

function toggleLoopback() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ action: 'set_loopback', enabled: !loopbackEnabled }));
}


</script>
</body>
</html>
