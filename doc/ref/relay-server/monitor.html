<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTT Relay Monitor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root {
    --bg-deep: #0a0e17;
    --bg-panel: #111827;
    --bg-card: #1a2235;
    --bg-card-hover: #1e2a42;
    --border: #2a3650;
    --text-primary: #e2e8f0;
    --text-secondary: #8892a8;
    --text-muted: #4a5568;
    --accent-green: #34d399;
    --accent-green-dim: rgba(52, 211, 153, 0.15);
    --accent-red: #f87171;
    --accent-red-dim: rgba(248, 113, 113, 0.15);
    --accent-blue: #60a5fa;
    --accent-blue-dim: rgba(96, 165, 250, 0.12);
    --accent-amber: #fbbf24;
    --accent-amber-dim: rgba(251, 191, 36, 0.12);
    --accent-violet: #a78bfa;
    --accent-violet-dim: rgba(167, 139, 250, 0.12);
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Noto Sans JP', system-ui, sans-serif;
    --radius: 8px;
    --transition: 150ms ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.5px;
    color: var(--accent-green);
  }

  .logo span { color: var(--text-muted); font-weight: 400; }

  .conn-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
  }

  .conn-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-red);
    transition: background var(--transition);
  }

  .conn-dot.connected {
    background: var(--accent-green);
    box-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .ws-input {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 12px;
    width: 260px;
    outline: none;
    transition: border-color var(--transition);
  }
  .ws-input:focus { border-color: var(--accent-blue); }

  .btn {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all var(--transition);
    background: var(--bg-card);
    color: var(--text-primary);
  }
  .btn:hover { background: var(--bg-card-hover); border-color: var(--accent-blue); }
  .btn.primary { background: var(--accent-blue); color: #0a0e17; border-color: var(--accent-blue); }
  .btn.primary:hover { opacity: 0.85; }
  .btn.danger { color: var(--accent-red); border-color: var(--accent-red-dim); }
  .btn.danger:hover { background: var(--accent-red-dim); }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 0;
    height: calc(100vh - 53px);
  }

  /* ── Sidebar: Group State ── */
  .sidebar {
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
  }

  .section-title {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .group-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
    transition: border-color var(--transition);
  }
  .group-card:hover { border-color: var(--accent-blue); }

  .group-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .group-name {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 14px;
  }

  .group-badge {
    font-family: var(--mono);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--accent-blue-dim);
    color: var(--accent-blue);
  }

  .floor-status {
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    margin-bottom: 10px;
  }

  .floor-idle {
    background: var(--bg-deep);
    color: var(--text-muted);
  }

  .floor-active {
    background: var(--accent-red-dim);
    color: var(--accent-red);
    border: 1px solid rgba(248, 113, 113, 0.3);
  }

  .member-list { list-style: none; }

  .member-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-secondary);
    border-bottom: 1px solid rgba(42, 54, 80, 0.5);
  }
  .member-item:last-child { border-bottom: none; }

  .member-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-green);
    flex-shrink: 0;
  }

  .member-dot.speaking {
    background: var(--accent-red);
    box-shadow: 0 0 6px rgba(248, 113, 113, 0.6);
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .member-ssrc { color: var(--text-primary); }
  .member-addr { color: var(--text-muted); font-size: 11px; margin-left: auto; }

  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 16px;
  }

  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    text-align: center;
  }

  .stat-value {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 700;
    color: var(--accent-green);
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ── Main: Event Log ── */
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
  }

  .filter-chip {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition);
    user-select: none;
  }
  .filter-chip:hover { border-color: var(--text-secondary); }
  .filter-chip.active { background: var(--accent-blue-dim); color: var(--accent-blue); border-color: var(--accent-blue); }

  .event-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    margin-left: auto;
  }

  .log-container {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }

  .log-row {
    display: grid;
    grid-template-columns: 72px 70px 88px 100px 1fr;
    gap: 0;
    padding: 5px 16px;
    font-family: var(--mono);
    font-size: 12px;
    border-bottom: 1px solid rgba(42, 54, 80, 0.3);
    transition: background var(--transition);
    align-items: center;
  }
  .log-row:hover { background: var(--bg-card); }

  .log-time { color: var(--text-muted); }
  .log-channel { font-size: 11px; }
  .log-channel.control { color: var(--accent-amber); }
  .log-channel.audio { color: var(--accent-violet); }
  .log-channel.system { color: var(--accent-blue); }

  .log-type {
    font-weight: 600;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 4px;
    width: fit-content;
  }

  .type-JOIN       { background: var(--accent-green-dim); color: var(--accent-green); }
  .type-LEAVE      { background: var(--accent-red-dim); color: var(--accent-red); }
  .type-PTT_ON     { background: var(--accent-red-dim); color: var(--accent-red); }
  .type-PTT_OFF    { background: var(--accent-blue-dim); color: var(--accent-blue); }
  .type-HEARTBEAT  { background: rgba(75, 85, 99, 0.3); color: var(--text-muted); }
  .type-PTT_DENY   { background: var(--accent-amber-dim); color: var(--accent-amber); }
  .type-RTP        { background: var(--accent-violet-dim); color: var(--accent-violet); }
  .type-TIMEOUT    { background: var(--accent-red-dim); color: var(--accent-red); }
  .type-SNAPSHOT   { background: var(--accent-blue-dim); color: var(--accent-blue); }
  .type-SERVER_START { background: var(--accent-green-dim); color: var(--accent-green); }

  .log-ssrc { color: var(--text-secondary); }
  .log-detail { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-muted);
    font-family: var(--mono);
    gap: 8px;
  }

  .empty-state svg { opacity: 0.3; }

  /* ── Audio Monitor Panel ── */
  .audio-panel { margin-top: 16px; }

  .audio-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }

  .audio-status {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .audio-status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
    transition: background var(--transition);
  }
  .audio-status-dot.active {
    background: var(--accent-green);
    box-shadow: 0 0 8px rgba(52,211,153,0.5);
    animation: pulse 1.5s infinite;
  }

  .audio-controls { display: flex; flex-direction: column; gap: 10px; }

  .btn-audio {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    padding: 8px 0;
    width: 100%;
    border: 1px solid var(--accent-blue);
    border-radius: var(--radius);
    cursor: pointer;
    background: var(--accent-blue-dim);
    color: var(--accent-blue);
    transition: all var(--transition);
  }
  .btn-audio:hover { background: var(--accent-blue); color: #0a0e17; }
  .btn-audio.recording {
    border-color: var(--accent-red);
    background: var(--accent-red-dim);
    color: var(--accent-red);
  }
  .btn-audio.recording:hover { background: var(--accent-red); color: #0a0e17; }

  .volume-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
  }
  .volume-row input[type=range] {
    flex: 1;
    accent-color: var(--accent-blue);
    cursor: pointer;
  }
  .vol-value { width: 32px; text-align: right; color: var(--text-secondary); }

  .audio-meter {
    height: 4px;
    background: var(--bg-deep);
    border-radius: 2px;
    overflow: hidden;
  }
  .audio-meter-bar {
    height: 100%;
    width: 0%;
    background: var(--accent-green);
    border-radius: 2px;
    transition: width 80ms ease-out;
  }

  .audio-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
  }
  .audio-stat { display: flex; justify-content: space-between; }
  .audio-stat-val { color: var(--text-secondary); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* ── Responsive ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .sidebar { max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
    .ws-input { width: 160px; }
    .log-row { grid-template-columns: 60px 56px 76px 88px 1fr; font-size: 11px; padding: 4px 8px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">PTT:RELAY <span>monitor</span></div>
    <div class="conn-status">
      <div class="conn-dot" id="connDot"></div>
      <span id="connLabel">disconnected</span>
    </div>
  </div>
  <div class="header-right">
    <input type="text" class="ws-input" id="wsUrl" value="ws://localhost:8765" placeholder="WebSocket URL" />
    <button class="btn primary" id="connectBtn" onclick="toggleConnection()">Connect</button>
    <button class="btn danger" id="clearBtn" onclick="clearLog()">Clear</button>
  </div>
</div>

<div class="layout">
  <!-- Sidebar: Groups -->
  <div class="sidebar">
    <div class="section-title">Groups</div>
    <div id="groupsContainer">
      <div class="group-card" style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 24px;">
        接続待機中...
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value" id="statCtrl">0</div>
        <div class="stat-label">Control Pkts</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statRtp">0</div>
        <div class="stat-label">RTP Pkts</div>
      </div>
    </div>

    <!-- Audio Monitor Panel -->
    <div class="audio-panel">
      <div class="section-title">Audio Monitor</div>
      <div class="audio-card">
        <div class="audio-status">
          <div class="audio-status-dot" id="audioDot"></div>
          <span id="audioStatusText">停止中</span>
        </div>
        <div class="audio-controls">
          <button class="btn-audio" id="audioBtn" onclick="toggleAudioMonitor()">▶ Monitor Audio</button>
          <div class="volume-row">
            <span>Vol</span>
            <input type="range" id="volumeSlider" min="0" max="100" value="80"
                   oninput="setVolume(this.value)">
            <span class="vol-value" id="volValue">80%</span>
          </div>
          <div class="audio-meter"><div class="audio-meter-bar" id="meterBar"></div></div>
        </div>
        <div class="audio-stats">
          <div class="audio-stat">Pkts <span class="audio-stat-val" id="audioPktCount">0</span></div>
          <div class="audio-stat">Queue <span class="audio-stat-val" id="audioQueue">0ms</span></div>
          <div class="audio-stat">Bitrate <span class="audio-stat-val" id="audioBps">—</span></div>
          <div class="audio-stat">Ratio <span class="audio-stat-val" id="audioRatio">—</span></div>
          <div class="audio-stat">Lost <span class="audio-stat-val" id="audioLost">0</span></div>
          <div class="audio-stat">Codec <span class="audio-stat-val">Opus/16k</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main: Event Log -->
  <div class="main">
    <div class="toolbar">
      <div class="filter-chip active" data-filter="all" onclick="setFilter('all', this)">All</div>
      <div class="filter-chip" data-filter="control" onclick="setFilter('control', this)">Control</div>
      <div class="filter-chip" data-filter="audio" onclick="setFilter('audio', this)">Audio</div>
      <div class="filter-chip" data-filter="system" onclick="setFilter('system', this)">System</div>
      <span class="event-count" id="eventCount">0 events</span>
    </div>
    <div class="log-container" id="logContainer">
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
        </svg>
        <span>イベント待機中</span>
      </div>
    </div>
  </div>
</div>

<script>
  let ws = null;
  let events = [];
  let activeFilter = 'all';
  let autoScroll = true;
  let ctrlCount = 0;
  let rtpCount = 0;
  let groupStates = {};

  const logContainer = document.getElementById('logContainer');
  const connDot = document.getElementById('connDot');
  const connLabel = document.getElementById('connLabel');
  const connectBtn = document.getElementById('connectBtn');

  // ── WebSocket ──
  function toggleConnection() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.close();
    } else {
      connect();
    }
  }

  function connect() {
    const url = document.getElementById('wsUrl').value;
    ws = new WebSocket(url);

    ws.onopen = () => {
      connDot.classList.add('connected');
      connLabel.textContent = 'connected';
      connectBtn.textContent = 'Disconnect';
      connectBtn.classList.remove('primary');
      connectBtn.classList.add('danger');
    };

    ws.onclose = () => {
      connDot.classList.remove('connected');
      connLabel.textContent = 'disconnected';
      connectBtn.textContent = 'Connect';
      connectBtn.classList.remove('danger');
      connectBtn.classList.add('primary');
    };

    ws.onerror = () => {
      connDot.classList.remove('connected');
      connLabel.textContent = 'error';
    };

    ws.onmessage = (e) => {
      try {
        const ev = JSON.parse(e.data);
        handleEvent(ev);
      } catch (err) {
        console.error('Parse error:', err);
      }
    };
  }

  // ── Audio Monitor ──
  const SAMPLE_RATE     = 16000;
  const FRAME_SAMPLES   = 320;
  const FRAME_DURATION  = FRAME_SAMPLES / SAMPLE_RATE;  // 0.02s
  const JITTER_INITIAL  = 0.40;  // 400ms 初期バッファ（LTEジッター吸収）
  const JITTER_MIN      = 0.18;  // 180ms を下回ったらフルリセット

  let audioCtx      = null;
  let gainNode      = null;
  let audioDecoder  = null;
  let isAudioActive = false;
  let nextPlayTime  = 0;
  let audioPkts     = 0;
  let audioLost     = 0;
  let lastSeq       = -1;
  let meterLevel    = 0;
  let bpsWindow     = [];   // [{t, bytes}, ...] ローリング2秒窓
  const BPS_WINDOW  = 2.0;  // seconds
  const PCM_FRAME_BYTES = FRAME_SAMPLES * 2;  // 320 samples × 2B = 640B

  function toggleAudioMonitor() {
    if (isAudioActive) stopAudioMonitor();
    else startAudioMonitor();
  }

  function startAudioMonitor() {
    if (!window.AudioDecoder) {
      alert('WebCodecs AudioDecoder 非対応ブラウザです。\nChrome 94+ / Edge 94+ を使用してください。');
      return;
    }
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      alert('WebSocket に接続してから試してください。');
      return;
    }

    audioCtx  = new AudioContext({ sampleRate: SAMPLE_RATE });
    gainNode  = audioCtx.createGain();
    gainNode.gain.value = document.getElementById('volumeSlider').value / 100;
    gainNode.connect(audioCtx.destination);
    nextPlayTime = audioCtx.currentTime + JITTER_INITIAL;

    audioDecoder = new AudioDecoder({
      output: (audioData) => {
        const buf = audioCtx.createBuffer(
          audioData.numberOfChannels,
          audioData.numberOfFrames,
          audioData.sampleRate
        );
        for (let ch = 0; ch < audioData.numberOfChannels; ch++) {
          audioData.copyTo(buf.getChannelData(ch), { planeIndex: ch });
        }
        audioData.close();

        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.connect(gainNode);

        /* ジッターバッファ: バッファが JITTER_MIN を下回ったら初期値まで完全リセット */
        const now = audioCtx.currentTime;
        if (nextPlayTime < now + JITTER_MIN) {
          nextPlayTime = now + JITTER_INITIAL;
        }
        src.start(nextPlayTime);
        nextPlayTime += FRAME_DURATION;

        /* メーターレベル更新 (簡易 RMS) */
        const ch0 = buf.getChannelData(0);
        let sum = 0;
        for (let i = 0; i < ch0.length; i++) sum += ch0[i] * ch0[i];
        meterLevel = Math.sqrt(sum / ch0.length);
        const pct = Math.min(100, meterLevel * 600);
        document.getElementById('meterBar').style.width = pct + '%';

        /* キュー深さ表示 */
        const queueMs = Math.round((nextPlayTime - now) * 1000);
        document.getElementById('audioQueue').textContent = queueMs + 'ms';
      },
      error: (e) => {
        console.error('AudioDecoder error:', e);
        setAudioStatus('エラー: ' + e.message, false);
      }
    });

    audioDecoder.configure({
      codec: 'opus',
      sampleRate: SAMPLE_RATE,
      numberOfChannels: 1,
    });

    isAudioActive = true;
    ws.send(JSON.stringify({ action: 'subscribe_audio' }));

    const btn = document.getElementById('audioBtn');
    btn.textContent = '■ Stop Monitor';
    btn.classList.add('recording');
    setAudioStatus('受信中...', true);
  }

  function stopAudioMonitor() {
    isAudioActive = false;
    if (ws && ws.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify({ action: 'unsubscribe_audio' }));
    if (audioDecoder) { audioDecoder.close(); audioDecoder = null; }
    if (audioCtx)     { audioCtx.close();     audioCtx     = null; }
    gainNode = null;
    bpsWindow = [];
    document.getElementById('meterBar').style.width = '0%';
    document.getElementById('audioQueue').textContent = '0ms';
    document.getElementById('audioBps').textContent = '—';
    document.getElementById('audioRatio').textContent = '—';
    const btn = document.getElementById('audioBtn');
    btn.textContent = '▶ Monitor Audio';
    btn.classList.remove('recording');
    setAudioStatus('停止中', false);
  }

  function setAudioStatus(text, active) {
    document.getElementById('audioStatusText').textContent = text;
    document.getElementById('audioDot').classList.toggle('active', active);
  }

  function setVolume(val) {
    document.getElementById('volValue').textContent = val + '%';
    if (gainNode) gainNode.gain.value = val / 100;
  }

  function handleAudioStream(ev) {
    if (!isAudioActive || !audioDecoder || audioDecoder.state !== 'configured') return;

    /* パケットロス / 新バースト検出 */
    if (lastSeq >= 0) {
      const expected = (lastSeq + 1) & 0xFFFF;
      const gap = (ev.seq - expected + 65536) & 0xFFFF;
      if (gap > 0 && gap <= 50) {
        /* 本物のパケットロス (1〜50フレーム以内) */
        audioLost += gap;
        document.getElementById('audioLost').textContent = audioLost;
      } else if (gap > 50) {
        /* 大きなギャップ = 新しいPTTバースト → ジッターバッファをリセット */
        nextPlayTime = audioCtx ? audioCtx.currentTime + JITTER_INITIAL : 0;
      }
    }
    lastSeq = ev.seq;
    audioPkts++;
    document.getElementById('audioPktCount').textContent = audioPkts;

    try {
      const bytes = Uint8Array.from(atob(ev.opus_b64), c => c.charCodeAt(0));

      /* ── Bitrate (ローリング2秒平均) ── */
      const tNow = Date.now() / 1000;
      bpsWindow.push({ t: tNow, n: bytes.length });
      while (bpsWindow.length > 0 && tNow - bpsWindow[0].t > BPS_WINDOW)
        bpsWindow.shift();
      if (bpsWindow.length >= 2) {
        const span = tNow - bpsWindow[0].t;
        const totalBytes = bpsWindow.reduce((s, e) => s + e.n, 0);
        const bps = Math.round(totalBytes * 8 / span);
        document.getElementById('audioBps').textContent =
          bps >= 1000 ? (bps / 1000).toFixed(1) + 'k' : bps + '';
      }

      /* ── 圧縮率 (PCM 640B vs Opus bytes.length) ── */
      const ratio = PCM_FRAME_BYTES / bytes.length;
      document.getElementById('audioRatio').textContent =
        ratio.toFixed(1) + 'x (' + bytes.length + 'B)';

      audioDecoder.decode(new EncodedAudioChunk({
        type: 'key',
        timestamp: Math.round(ev.ts * 1e6 / SAMPLE_RATE),
        data: bytes,
      }));
    } catch (e) {
      console.warn('Audio decode skip:', e);
    }
  }

  // ── Event Handling ──
  function handleEvent(ev) {
    /* 音声ストリームはイベントログに追加しない */
    if (ev.channel === 'audio_stream') {
      handleAudioStream(ev);
      return;
    }
    events.push(ev);

    // Update counters
    if (ev.channel === 'control') ctrlCount++;
    if (ev.channel === 'audio') rtpCount++;
    document.getElementById('statCtrl').textContent = ctrlCount;
    document.getElementById('statRtp').textContent = rtpCount;
    document.getElementById('eventCount').textContent = `${events.length} events`;

    // Update group state
    if (ev.group_state) {
      groupStates[ev.group_id] = ev.group_state;
      renderGroups();
    }
    if (ev.type === 'SNAPSHOT' && ev.groups) {
      groupStates = {};
      for (const [gid, g] of Object.entries(ev.groups)) {
        groupStates[parseInt(gid)] = g;
      }
      renderGroups();
    }

    // Add log row
    if (activeFilter === 'all' || activeFilter === ev.channel) {
      appendLogRow(ev);
    }
  }

  function appendLogRow(ev) {
    // Remove empty state if present
    const empty = logContainer.querySelector('.empty-state');
    if (empty) empty.remove();

    const row = document.createElement('div');
    row.className = 'log-row';
    row.dataset.channel = ev.channel || '';

    const time = ev._iso || '--:--:--';
    const channel = ev.channel || '?';
    const type = ev.type || '?';
    const ssrc = ev.ssrc || '';
    const detail = buildDetail(ev);

    row.innerHTML = `
      <span class="log-time">${time}</span>
      <span class="log-channel ${channel}">${channel}</span>
      <span class="log-type type-${type}">${type}</span>
      <span class="log-ssrc">${ssrc}</span>
      <span class="log-detail" title="${escapeHtml(detail)}">${escapeHtml(detail)}</span>
    `;

    logContainer.appendChild(row);

    // Keep max 2000 rows in DOM
    while (logContainer.children.length > 2000) {
      logContainer.removeChild(logContainer.firstChild);
    }

    if (autoScroll) {
      logContainer.scrollTop = logContainer.scrollHeight;
    }
  }

  function buildDetail(ev) {
    const parts = [];
    if (ev.result) parts.push(`result=${ev.result}`);
    if (ev.member_count !== undefined) parts.push(`members=${ev.member_count}`);
    if (ev.holder) parts.push(`holder=${ev.holder}`);
    if (ev.seq !== undefined) parts.push(`seq=${ev.seq}`);
    if (ev.payload_size !== undefined) parts.push(`payload=${ev.payload_size}B`);
    if (ev.relayed_to !== undefined) parts.push(`relay→${ev.relayed_to}`);
    if (ev.marker) parts.push('MARKER');
    if (ev.src) parts.push(`from=${ev.src}`);
    if (ev.control_port) parts.push(`ctrl=${ev.control_port} audio=${ev.audio_port}`);
    return parts.join('  ');
  }

  // ── Group Rendering ──
  function renderGroups() {
    const container = document.getElementById('groupsContainer');
    const ids = Object.keys(groupStates).sort((a, b) => a - b);

    if (ids.length === 0) {
      container.innerHTML = '<div class="group-card" style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 24px;">グループなし</div>';
      return;
    }

    container.innerHTML = ids.map(gid => {
      const g = groupStates[gid];
      const members = Object.values(g.members || {});
      const floorSsrc = g.floor_holder ? `0x${g.floor_holder.toString(16).toUpperCase().padStart(8, '0')}` : null;
      const floorDisplay = g.floor_holder ? g.floor_holder : floorSsrc;

      const memberHtml = members.length === 0
        ? '<div style="color: var(--text-muted); font-size: 12px; padding: 4px 0;">メンバーなし</div>'
        : members.map(m => {
            const isSpeaking = floorSsrc && m.ssrc === floorSsrc;
            return `<li class="member-item">
              <span class="member-dot ${isSpeaking ? 'speaking' : ''}"></span>
              <span class="member-ssrc">${m.ssrc}</span>
              <span class="member-addr">${m.ctrl_addr} (${m.last_seen}s ago)</span>
            </li>`;
          }).join('');

      return `
        <div class="group-card">
          <div class="group-header">
            <span class="group-name">Group ${gid}</span>
            <span class="group-badge">${members.length} member${members.length !== 1 ? 's' : ''}</span>
          </div>
          <div class="floor-status ${g.floor_holder ? 'floor-active' : 'floor-idle'}">
            Floor: ${g.floor_holder ? `🎙 ${floorSsrc}` : 'IDLE'}
          </div>
          <ul class="member-list">${memberHtml}</ul>
        </div>
      `;
    }).join('');
  }

  // ── Filters ──
  function setFilter(filter, chip) {
    activeFilter = filter;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');

    // Re-render log
    logContainer.innerHTML = '';
    const filtered = events.filter(ev => filter === 'all' || ev.channel === filter);
    if (filtered.length === 0) {
      logContainer.innerHTML = '<div class="empty-state"><span>フィルターに一致するイベントなし</span></div>';
    } else {
      filtered.forEach(ev => appendLogRow(ev));
    }
  }

  function clearLog() {
    events = [];
    ctrlCount = 0;
    rtpCount = 0;
    document.getElementById('statCtrl').textContent = '0';
    document.getElementById('statRtp').textContent = '0';
    document.getElementById('eventCount').textContent = '0 events';
    logContainer.innerHTML = '<div class="empty-state"><span>ログをクリアしました</span></div>';
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Auto-scroll detection
  logContainer.addEventListener('scroll', () => {
    const { scrollTop, scrollHeight, clientHeight } = logContainer;
    autoScroll = scrollHeight - scrollTop - clientHeight < 50;
  });
</script>
</body>
</html>
